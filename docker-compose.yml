version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      # 這行允許在開發模式下進行即時重載，但對於生產部署可以移除
      - ./frontend:/app/frontend
      - /app/frontend/node_modules # 避免 host 上的 node_modules 覆蓋容器內的
    depends_on:
      - backend # 前端依賴後端，確保後端先啟動
      - postgres
    environment:
      VITE_BACKEND_API_URL: http://localhost:8000
      VITE_API_BASE_URL: http://localhost:8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # 這行允許在開發模式下進行即時重載，但對於生產部署可以移除
      - ./backend:/app/backend
    dns:
      # Fallback DNS (Google + Cloudflare) 避免容器 DNS 解析失敗
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 如果您的後端需要任何環境變數，可以在這裡設定
      # 例如：DATABASE_URL: postgresql://user:password@db:5432/mydb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: "YourSecretKeyHere"  # Replace with your actual secret key !!important!!
      FERNET_KEY: "zCb-XFSg6qE4hr63-7siw_bVnUuQi3Q6JQfRqvsNt3Y="  # Replace with your actual Fernet key !!important!!
      ALGORITHM: HS256 # JWT algorithm
      TOKEN_EXPIRE_MINUTES: 300 # Token expiration time in minutes
      CHROMADB_PATH: ./db/chroma_db # Path to your ChromaDB database
      DB_PATH: ./db/morning_eat.db # Path to your SQLite database
      GOOGLE_API_KEY: "your_google_ai_studio_api_key"  # Required for Gemini LLM !!important!!
      QWEN_ASR_MODEL: Qwen/Qwen3-ASR-0.6B
      HF_HOME: /root/.cache/huggingface
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:1.5b
      # LLM_MODEL: gemini_api
      DB_URL: postgresql://postgres:postgres@postgres:5432/morning_eat

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes # 啟用 AOF 持久化模式

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: morning_eat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: []
    command: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    # 💡 核心優化：利用內建的 ollama list 當作健康檢查（免安裝 curl）
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  redis_data:
  ollama_data:
  postgres_data:

networks:
  default:
    # 預設使用橋接網路，方便服務間通訊
    # 如果您需要更複雜的網路配置，可以在這裡定義
